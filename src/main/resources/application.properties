# 本地敏感数据访问网关配置
spring.application.name=data-privacy-gateway

# 单条记录归一后允许的最大节点数（对象/数组/叶子合计），超限按拒绝处理
privacy.gateway.max-nodes-per-record=2000
# 单次访问响应允许的最大叶子数，超限整体拒绝（不返回部分结果）
privacy.gateway.max-leaves-per-response=5000
# 单个数组允许的最大长度
privacy.gateway.max-array-length=500
# 数组超长时是否截断（true=截断并打 truncated 标记；false=明确拒绝）
privacy.gateway.truncate-oversize-arrays=true
# 单次访问判定的处理耗时上限（毫秒），超时立即失败且不泄漏已解密中间结果
privacy.gateway.processing-timeout-millis=2000
# 审计记录留存天数，超期由 purge 接口物理清除，不残留可识别信息
privacy.gateway.audit-retention-days=30
