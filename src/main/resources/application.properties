# ===== 本地敏感数据访问网关配置 =====

# 单条记录最大字节数（整体规模硬上限，任何模式超限均拒绝）
privacy-gateway.limits.max-record-bytes=16384
# 最大嵌套深度
privacy-gateway.limits.max-depth=8
# 单个数组最大长度
privacy-gateway.limits.max-array-size=200
# 单个字符串最大长度（字符串截断会破坏语义与密文，始终拒绝）
privacy-gateway.limits.max-string-length=1024
# 单次处理耗时上限（毫秒）
privacy-gateway.limits.max-elapsed-millis=1000
# 超限策略：REJECT（拒绝）或 TRUNCATE（仅深度/数组可截断）
privacy-gateway.limits.mode=REJECT
# TRUNCATE 模式下数组保留长度
privacy-gateway.limits.truncate-array-to=50
# 审计库容量上限（超过后整段淘汰最旧条目）
privacy-gateway.limits.max-audit-entries=10000

# 审计留存 TTL（毫秒），过期整条清除
privacy-gateway.retention.audit-ttl-millis=86400000
# 审计清理调度间隔（毫秒）
privacy-gateway.retention.purge-interval-millis=60000

logging.level.com.github.xingjianluo.dataprivacygatewayjava=INFO
